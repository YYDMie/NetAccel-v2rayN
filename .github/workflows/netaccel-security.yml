name: NetAccel security gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-security:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore v2rayN/v2rayN.slnx
      - name: Run Plan 16 security gate
        shell: powershell
        run: ./scripts/plan16/security-gate.ps1
      - name: Upload SPDX SBOM
        uses: actions/upload-artifact@v4
        with:
          name: netaccel-wpf-sbom
          path: artifacts/sbom/netaccel-wpf.spdx.json
          if-no-files-found: error
