name: NetAccel signed Windows release

on:
  workflow_dispatch:
    inputs:
      version:
        required: true
        type: string
      channel:
        required: true
        type: choice
        options: [stable, beta, dev]
      artifact_url:
        required: true
        type: string

permissions:
  contents: read

jobs:
  signed-windows:
    runs-on: windows-2025
    env:
      NETACCEL_RELEASE_SIGNING_KEY_PEM: ${{ secrets.NETACCEL_RELEASE_SIGNING_KEY_PEM }}
      NETACCEL_RELEASE_SIGNING_KEY_ID: ${{ vars.NETACCEL_RELEASE_SIGNING_KEY_ID }}
      NETACCEL_RELEASE_PUBLIC_KEY_PEM: ${{ vars.NETACCEL_RELEASE_PUBLIC_KEY_PEM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Validate release trust configuration
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:NETACCEL_RELEASE_SIGNING_KEY_PEM) -or
              [string]::IsNullOrWhiteSpace($env:NETACCEL_RELEASE_SIGNING_KEY_ID) -or
              [string]::IsNullOrWhiteSpace($env:NETACCEL_RELEASE_PUBLIC_KEY_PEM)) {
            throw 'Release signing key, key id, and public key are required.'
          }
      - name: Restore
        run: dotnet restore v2rayN/v2rayN/v2rayN.csproj
      - name: Test managed update security
        run: dotnet test NetAccel.Managed.Tests/NetAccel.Managed.Tests.csproj --filter FullyQualifiedName~ManagedUpdateSecurityTests --no-restore
      - name: Publish WPF and updater
        shell: powershell
        run: |
          dotnet publish v2rayN/v2rayN/v2rayN.csproj -c Release -r win-x64 --self-contained true -o artifacts/wpf
          dotnet publish NetAccel.Updater/NetAccel.Updater.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o artifacts/wpf/updater
          $trust = Join-Path 'artifacts/wpf/release-trust' ($env:NETACCEL_RELEASE_SIGNING_KEY_ID + '.pem')
          New-Item -ItemType Directory -Force (Split-Path $trust) | Out-Null
          [IO.File]::WriteAllText((Resolve-Path (Split-Path $trust)).Path + '\' + (Split-Path $trust -Leaf), $env:NETACCEL_RELEASE_PUBLIC_KEY_PEM, [Text.UTF8Encoding]::new($false))
          ./scripts/plan16/verify-release-package.ps1 `
            -PublishDirectory artifacts/wpf `
            -ReleaseKeyId $env:NETACCEL_RELEASE_SIGNING_KEY_ID
          Compress-Archive -Path artifacts/wpf/* -DestinationPath "artifacts/netaccel-${{ inputs.version }}-windows-x86_64.zip"
      - name: Sign release manifest
        shell: powershell
        run: |
          ./scripts/plan16/sign-release-manifest.ps1 `
            -ArtifactPath "artifacts/netaccel-${{ inputs.version }}-windows-x86_64.zip" `
            -ArtifactUrl "${{ inputs.artifact_url }}" `
            -Version "${{ inputs.version }}" `
            -Channel "${{ inputs.channel }}" `
            -OutputPath artifacts/client-release-manifest.json
      - name: Generate SPDX SBOM
        shell: powershell
        run: ./scripts/plan16/generate-sbom.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: netaccel-${{ inputs.version }}-signed
          path: |
            artifacts/netaccel-${{ inputs.version }}-windows-x86_64.zip
            artifacts/client-release-manifest.json
            artifacts/sbom/netaccel-wpf.spdx.json
          if-no-files-found: error
